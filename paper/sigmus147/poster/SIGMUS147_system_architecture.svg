<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <style>
    text{font-family:'Noto Sans CJK JP','Noto Sans JP',sans-serif;fill:#172033}
    .title{font-size:48px;font-weight:700}.h{font-size:24px;font-weight:700}.boxh{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:12px}
    .box{fill:#fff;stroke-width:2}.blue{fill:#f4f9ff;stroke:#3f82c4}.green{fill:#f5fbf6;stroke:#4f9b68}.orange{fill:#fff8f2;stroke:#dd8a45}.purple{fill:#faf5fc;stroke:#9a6bb0}.gray{fill:#fafafa;stroke:#777}.state{fill:#fbfdfb;stroke:#368b54;stroke-width:3}
    .arrow{stroke:#172033;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#666;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#a)}
  </style>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#172033"/></marker>
</defs>
<rect width="1600" height="1000" fill="white"/>
<text x="42" y="70" class="title">システム構成</text>
<text x="42" y="112" class="body">歌唱者の音高を観測・解釈し，主観的調性感の変化を追跡しながら，複数声部をリアルタイム生成する．</text>

<!-- input -->
<text x="655" y="72" class="h" text-anchor="middle" fill="#2469a6">歌唱（入力）</text>
<rect x="455" y="90" width="400" height="82" rx="14" class="box blue"/>
<text x="555" y="125" class="boxh" text-anchor="middle">マイク入力</text><text x="555" y="151" class="small" text-anchor="middle">歌唱</text>
<line x1="655" y1="103" x2="655" y2="158" stroke="#999" stroke-dasharray="4 5"/>
<text x="755" y="125" class="boxh" text-anchor="middle">MIDI入力</text><text x="755" y="151" class="small" text-anchor="middle">テスト時</text>

<!-- pipeline -->
<path d="M655 172 V198" class="arrow"/>
<rect x="410" y="200" width="490" height="72" rx="12" class="box blue"/><text x="435" y="232" class="boxh">1　Pitch Operator</text><text x="435" y="258" class="small">連続音高を観測し，Observed Pitch を生成</text>
<path d="M655 272 V292" class="arrow"/>
<rect x="410" y="294" width="490" height="72" rx="12" class="box blue"/><text x="435" y="326" class="boxh">2　Pitch Interpreter</text><text x="435" y="352" class="small">時間的文脈から Interpreted Pitch を決定</text>
<path d="M655 366 V386" class="arrow"/>
<rect x="410" y="388" width="490" height="72" rx="12" class="box green"/><text x="435" y="420" class="boxh">3　Tonality Operator</text><text x="435" y="446" class="small">調性状態を推定・更新</text>
<path d="M655 460 V480" class="arrow"/>
<rect x="390" y="482" width="530" height="145" rx="14" class="state"/>
<text x="655" y="518" class="h" text-anchor="middle">Relative Tonal Frame</text>
<text x="655" y="545" class="small" text-anchor="middle">主観的調性感を扱う相対的な調性座標系</text>
<circle cx="470" cy="580" r="13" fill="#368b54"/><text x="495" y="586" class="small">原点：Subjective Tonic</text>
<circle cx="690" cy="580" r="13" fill="#368b54"/><text x="715" y="586" class="small">調性状態</text>
<circle cx="820" cy="580" r="13" fill="#368b54"/><text x="845" y="586" class="small">時間的更新</text>

<path d="M655 627 V647" class="arrow"/>
<rect x="410" y="649" width="490" height="72" rx="12" class="box orange"/><text x="435" y="681" class="boxh">4　Harmony Generator</text><text x="435" y="707" class="small">和声・対位法により各声部の Target Degree を決定</text>
<path d="M655 721 V741" class="arrow"/>
<rect x="410" y="743" width="490" height="72" rx="12" class="box orange"/><text x="435" y="775" class="boxh">5　Voice Leading</text><text x="435" y="801" class="small">音域・直前音・跳躍量を考慮し Target Pitch を決定</text>
<path d="M655 815 V835" class="arrow"/>
<rect x="410" y="837" width="490" height="62" rx="12" class="box purple"/><text x="435" y="875" class="boxh">6　Voice Generator　— 歌声生成 —</text>
<path d="M900 868 H1030" class="arrow"/>

<!-- output -->
<rect x="1040" y="790" width="500" height="155" rx="16" fill="#fff7f7" stroke="#d86b73" stroke-width="2"/>
<text x="1290" y="826" class="h" text-anchor="middle" fill="#c94e5a">一人合唱（出力）</text>
<text x="1090" y="870" class="boxh">Lead</text><text x="1190" y="870" class="boxh">Soprano</text><text x="1310" y="870" class="boxh">Alto</text><text x="1400" y="870" class="boxh">Tenor</text><text x="1490" y="870" class="boxh">Bass</text>
<text x="1290" y="916" class="small" text-anchor="middle">歌い手の調性基準に追従する複数声部をリアルタイム生成</text>

<!-- conceptual model -->
<rect x="980" y="95" width="555" height="310" rx="16" fill="#fff" stroke="#777" stroke-width="2" stroke-dasharray="8 7"/>
<text x="1258" y="130" class="h" text-anchor="middle">主観的調性感のモデル</text>
<text x="1035" y="185" class="boxh">Subjective Tonality</text><text x="1035" y="212" class="small">主観的調性感</text>
<path d="M1205 195 H1260" class="arrow"/>
<text x="1280" y="185" class="boxh">Relative Tonal Frame</text><text x="1280" y="212" class="small">相対調性座標系</text>
<path d="M1400 235 V270" class="arrow"/>
<text x="1280" y="302" class="boxh">Subjective Tonic = 原点</text>
<circle cx="1400" cy="340" r="24" fill="#368b54" opacity=".18"/><circle cx="1400" cy="340" r="7" fill="#368b54"/>
<ellipse cx="1400" cy="340" rx="85" ry="34" fill="none" stroke="#4f9b68" stroke-width="2"/><ellipse cx="1400" cy="340" rx="120" ry="55" fill="none" stroke="#4f9b68" stroke-width="1.5" opacity=".65"/>
<path d="M1258 405 V424 H910" class="dash"/>

<!-- visualization -->
<path d="M920 555 H1040" class="dash"/>
<rect x="1050" y="485" width="360" height="145" rx="14" class="box gray"/>
<text x="1230" y="522" class="h" text-anchor="middle">Visualization</text><text x="1230" y="551" class="small" text-anchor="middle">Relative Tonal Frame の状態と変化を可視化</text>
<circle cx="1230" cy="590" r="7" fill="#368b54"/><ellipse cx="1230" cy="590" rx="70" ry="24" fill="none" stroke="#777"/><ellipse cx="1230" cy="590" rx="105" ry="40" fill="none" stroke="#aaa"/>

<!-- note -->
<rect x="42" y="760" width="310" height="185" rx="12" fill="#fafafa" stroke="#bbb"/>
<text x="62" y="797" class="boxh">処理の役割</text>
<text x="62" y="830" class="small">観測・解釈：歌声から音高情報を得る</text>
<text x="62" y="862" class="small">調性推定：Relative Tonal Frame を更新</text>
<text x="62" y="894" class="small">音楽生成：和声・対位法＋声部進行</text>
<text x="62" y="926" class="small">音声生成：目標音高へ変換して合唱出力</text>
</svg>
